<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="pri.css">
</head>
<body class="theme-dark">
    <div class="container">
        <div class="header">
            <h1>Tic Tac Toe</h1>
            <p class="instructions">Click a cell to place your mark. Get three in a row to win!</p>
        </div>

        <div class="controls">
            <div class="theme-selector">
                <label for="theme-select">Theme:</label>
                <select id="theme-select">
                    <option value="theme-dark">Dark</option>
                    <option value="theme-neon">Neon</option>
                    <option value="theme-retro">Retro</option>
                    <option value="theme-minimalist">Minimalist</option>
                    <option value="theme-light">Light</option>
                </select>
            </div>
        </div>

        <div class="player-indicator">
            <div class="player x-player active">
                <span class="player-icon">X</span>
                <span class="player-label">Player X</span>
            </div>
            <div class="player o-player">
                <span class="player-icon">O</span>
                <span class="player-label">Player O</span>
            </div>
        </div>

        <div class="score-board">
            <div class="score-item">
                <span class="score-label">X Wins</span>
                <span class="score-value" id="x-score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Draws</span>
                <span class="score-value" id="draw-score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">O Wins</span>
                <span class="score-value" id="o-score">0</span>
            </div>
        </div>

        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="message"></div>

        <div class="button-group">
            <button class="reset-button">
                <span class="button-icon">↻</span>
                Reset Game
            </button>
            <button class="reset-scores-button">
                <span class="button-icon">✕</span>
                Reset Scores
            </button>
        </div>
    </div>
    <script src="pri.js"></script>
</body>
</html>
